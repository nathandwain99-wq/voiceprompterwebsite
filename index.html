<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoicePrompter | Speak Naturally. Stay on Track.</title>
    <meta name="description" content="VoicePrompter is a voice-controlled teleprompter that follows your speech automatically.">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070914;
            color: #f5f7ff;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 9, 20, 0.9);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .nav-inner {
            max-width: 1150px;
            margin: auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 21px;
            font-weight: 800;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #00eaff, #8b5cf6);
            color: #070914;
            font-size: 20px;
            box-shadow: 0 0 25px rgba(0,234,255,0.25);
        }

        .nav-links {
            display: flex;
            gap: 26px;
            align-items: center;
            color: #b8bfd5;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: white;
        }

        .hero {
            max-width: 1150px;
            margin: auto;
            padding: 105px 24px 95px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 70px;
            align-items: center;
        }

        .eyebrow {
            color: #00eaff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(48px, 6vw, 76px);
            line-height: 0.98;
            letter-spacing: -3px;
            margin-bottom: 25px;
        }

        .gradient {
            background: linear-gradient(90deg, #00eaff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            color: #aeb5ca;
            font-size: 19px;
            max-width: 650px;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 0 25px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            transition: transform .2s, box-shadow .2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: linear-gradient(90deg, #00d9f5, #8b5cf6);
            color: #050711;
            box-shadow: 0 12px 35px rgba(0,210,245,0.2);
        }

        .secondary {
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: white;
        }

        .app-card {
            min-height: 390px;
            border-radius: 28px;
            border: 1px solid rgba(0,234,255,0.18);
            background:
                radial-gradient(circle at 30% 20%, rgba(0,234,255,.12), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(139,92,246,.16), transparent 40%),
                #0d1020;
            box-shadow: 0 30px 80px rgba(0,0,0,.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px;
            position: relative;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px;
            background: #080b16;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,.5);
        }

        .screen-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            color: #78809a;
            font-size: 12px;
        }

        .screen-text {
            font-size: 25px;
            line-height: 1.5;
            color: #eef1ff;
        }

        .screen-text span {
            color: #00eaff;
        }
