<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">

<title>VoicePrompter Mobile</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(circle at top, #151c35 0%, #080b14 55%);
    color: #ffffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* =========================
   MAIN APP
========================= */

#app {
    width: 100%;
    min-height: 100vh;
    padding: 22px;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo .voice {
    color: #00e5ff;
}

.logo .prompter {
    color: #a855f7;
}

.subtitle {
    margin-top: 5px;
    color: #8d96ad;
    font-size: 14px;
}

/* =========================
   EDITOR
========================= */

.editor-card {
    background: rgba(20, 25, 42, .92);
    border: 1px solid rgba(0, 229, 255, .18);
    border-radius: 18px;
    padding: 15px;
    box-shadow:
        0 10px 35px rgba(0, 0, 0, .35),
        0 0 30px rgba(0, 229, 255, .04);
}

#scriptInput {
    width: 100%;
    min-height: 260px;
    resize: vertical;

    border: none;
    outline: none;

    border-radius: 12px;

    background: #0c101c;
    color: #f4f7ff;

    padding: 16px;

    font-size: 18px;
    line-height: 1.6;

    font-family: inherit;
}

#scriptInput::placeholder {
    color: #5f6880;
}

/* =========================
   BUTTONS
========================= */

.button-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

button {
    flex: 1;

    border: none;
    border-radius: 12px;

    padding: 14px 10px;

    color: white;
    background: #20283c;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .15s,
        background .15s,
        box-shadow .15s;
}

button:active {
    transform: scale(.97);
}

#startBtn {
    background: linear-gradient(
        135deg,
        #00bcd4,
        #007cff
    );

    box-shadow:
        0 5px 20px rgba(0, 188, 212, .25);
}

#clearBtn {
    background: #202638;
}

/* =========================
   SPEED
========================= */

.speed-container {
    margin-top: 16px;
}

.speed-label {
    display: flex;
    justify-content: space-between;

    color: #929bb0;
    font-size: 13px;

    margin-bottom: 6px;
}

#speed {
    width: 100%;
    accent-color: #00e5ff;
}

/* =========================
   PROMPTER
========================= */

#prompter {
    display: none;

    position: fixed;
    inset: 0;

    background: #000;

    z-index: 1000;

    overflow: hidden;
}

/*
   The script itself NEVER has an animation
   attached to it.

   Voice mode moves it only when a spoken
   word is successfully matched.
*/

#scriptDisplay {
    position: absolute;

    width: 100%;

    padding:
        48vh 25px
        48vh 25px;

    text-align: center;

    font-size: 36px;
    line-height: 1.65;

    transform:
        translate3d(0, 0, 0);

    transition:
        transform .18s ease-out;

    will-change: transform;
}

/* =========================
   WORDS
========================= */

.script-word {
    display: inline;
}

.script-word.active {
    color: #00e5ff;

    text-shadow:
        0 0 12px rgba(0, 229, 255, .7);
}

/* =========================
   CENTER GUIDE
========================= */

#guide {
    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0, 229, 255, .85),
            transparent
        );

    box-shadow:
        0 0 12px rgba(0, 229, 255, .45);

    pointer-events: none;
}

/* =========================
   PROMPTER CONTROLS
========================= */

#prompterControls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 20px;

    display: flex;

    justify-content: center;

    gap: 10px;

    z-index: 1100;
}

#prompterControls button {
    flex: none;

    min-width: 105px;

    background:
        rgba(25, 30, 45, .92);

    border:
        1px solid rgba(255,255,255,.1);

    backdrop-filter: blur(10px);
}

/* =========================
   MODE BUTTONS
========================= */

#voiceModeBtn.active {
    background:
        linear-gradient(
            135deg,
            #00b8d4,
            #0066ff
        );

    box-shadow:
        0 0 20px rgba(0, 188, 212, .3);
}

#autoModeBtn.active {
    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

    box-shadow:
        0 0 20px rgba(168, 85, 247, .3);
}

/* =========================
   STATUS
========================= */

#status {
    position: absolute;

    top: 18px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 14px;

    color: #8d96ad;

    z-index: 1100;
}

#status.listening {
    color: #00e5ff;

    text-shadow:
        0 0 10px rgba(0, 229, 255, .6);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #app {
        padding: 16px;
    }

    .logo {
        font-size: 27px;
    }

    #scriptInput {
        min-height: 230px;
        font-size: 17px;
    }

    #scriptDisplay {
        font-size: 31px;
        padding-left: 20px;
        padding-right: 20px;
    }

}
</style>
</head>

<body>

<div id="app">

    <div class="header">
        <div class="logo">
            <span class="voice">Voice</span><span class="prompter">Prompter</span>
        </div>

        <div class="subtitle">
            Your script. Your voice. Your pace.
        </div>
    </div>


    <div class="editor-card">

        <textarea
            id="scriptInput"
            placeholder="Paste or type your script here..."
        ></textarea>


        <div class="button-row">

            <button id="startBtn">
                ▶ Start Prompter
            </button>

            <button id="clearBtn">
                Clear
            </button>

        </div>


        <div class="speed-container">

            <div class="speed-label">
                <span>Auto Scroll Speed</span>
                <span id="speedValue">3</span>
            </div>

            <input
                id="speed"
                type="range"
                min="1"
                max="10"
                value="3"
            >

        </div>

    </div>

</div>


<!-- =========================
     FULLSCREEN PROMPTER
========================= -->

<div id="prompter">

    <div id="status">
        Mode: Paused
    </div>

    <div id="guide"></div>

    <div id="scriptDisplay"></div>


    <div id="prompterControls">

        <button id="voiceModeBtn">
            🎙 Voice
        </button>

        <button id="autoModeBtn">
            ▶ Auto
        </button>

        <button id="restartBtn">
            ↻ Restart
        </button>

        <button id="exitBtn">
            ✕ Exit
        </button>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const scriptInput =
    document.getElementById("scriptInput");

const startBtn =
    document.getElementById("startBtn");

const clearBtn =
    document.getElementById("clearBtn");

const prompter =
    document.getElementById("prompter");

const scriptDisplay =
    document.getElementById("scriptDisplay");

const status =
    document.getElementById("status");

const voiceModeBtn =
    document.getElementById("voiceModeBtn");

const autoModeBtn =
    document.getElementById("autoModeBtn");

const restartBtn =
    document.getElementById("restartBtn");

const exitBtn =
    document.getElementById("exitBtn");

const speed =
    document.getElementById("speed");

const speedValue =
    document.getElementById("speedValue");


/* =========================================================
   STATE
========================================================= */

let scriptWords = [];

let currentWord = 0;

let voiceMode = false;

let autoMode = false;

let recognition = null;

let recognitionRunning = false;

let autoFrame = null;

let scriptOffset = 0;


/* =========================================================
   SPEED DISPLAY
========================================================= */

speed.addEventListener(
    "input",
    () => {
        speedValue.textContent =
            speed.value;
    }
);


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeWord(word) {

    return word
        .toLowerCase()
        .replace(/[^\w']/g, "");

}


/* =========================================================
   BUILD SCRIPT
========================================================= */

function buildScript() {

    const text =
        scriptInput.value.trim();

    if (!text) {

        alert("Please enter a script first.");

        return false;
    }

    scriptDisplay.innerHTML = "";

    scriptWords = [];

    currentWord = 0;

    scriptOffset = 0;


    /*
       Preserve whitespace while creating
       individual word spans.
    */

    const pieces =
        text.split(/(\s+)/);


    for (const piece of pieces) {

        if (/^\s+$/.test(piece)) {

            scriptDisplay.appendChild(
                document.createTextNode(piece)
            );

            continue;
        }


        const span =
            document.createElement("span");

        span.className =
            "script-word";

        span.textContent =
            piece;

        scriptDisplay.appendChild(span);


        scriptWords.push({

            original: piece,

            normalized:
                normalizeWord(piece),

            element: span

        });
    }


    scriptDisplay.style.transform =
        "translate3d(0,0,0)";

    return true;
}


/* =========================================================
   UPDATE ACTIVE WORD
========================================================= */

function updateActiveWord() {

    document
        .querySelectorAll(".script-word.active")
        .forEach(
            el => el.classList.remove("active")
        );


    if (
        currentWord >= 0 &&
        currentWord < scriptWords.length
    ) {

        const word =
            scriptWords[currentWord];

        word.element.classList.add("active");


        /*
           CENTER ONLY WHEN WE ACTUALLY
           ADVANCE TO A NEW WORD.
        */

        const rect =
            word.element.getBoundingClientRect();

        const center =
            window.innerHeight / 2;

        const wordCenter =
            rect.top +
            rect.height / 2;

        const movement =
            center - wordCenter;

        scriptOffset += movement;

        scriptDisplay.style.transform =
            `translate3d(0, ${scriptOffset}px, 0)`;
    }
}


/* =========================================================
   START PROMPTER
========================================================= */

startBtn.addEventListener(
    "click",
    () => {

        if (!buildScript()) return;

        prompter.style.display =
            "block";

        document.documentElement
            .requestFullscreen?.()
            .catch(() => {});

        status.textContent =
            "Mode: Paused";

    }
);


/* =========================================================
   CLEAR
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        scriptInput.value = "";

    }
);


/* =========================================================
   STOP EVERYTHING
========================================================= */

function stopEverything() {

    voiceMode = false;

    autoMode = false;

    voiceModeBtn.classList.remove("active");

    autoModeBtn.classList.remove("active");


    if (autoFrame !== null) {

        cancelAnimationFrame(autoFrame);

        autoFrame = null;
    }


    if (recognition) {

        try {
            recognition.stop();
        } catch (e) {}

    }

    recognitionRunning = false;

    status.classList.remove("listening");

    status.textContent =
        "Mode: Paused";
}


/* =========================================================
   VOICE RECOGNITION SETUP
========================================================= */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice recognition is not supported in this browser. Use Chrome on Android."
        );

        return false;
    }


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        true;


    /*
       IMPORTANT.

       We DO NOT use interim results.

       Interim speech results constantly change
       while a person is talking and can make
       the teleprompter jump around.
    */

    recognition.interimResults =
        false;


    recognition.lang =
        "en-US";


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            recognitionRunning =
                true;

            if (!voiceMode) return;

            status.textContent =
                "🎙 Listening...";

            status.classList.add(
                "listening"
            );
        };


    recognition.onresult =
        event => {

            /*
               HARD SAFETY CHECK.

               Speech can NEVER move the script
               unless Voice Mode is currently active.
            */

            if (!voiceMode) return;


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const result =
                    event.results[i];


                if (!result.isFinal)
                    continue;


                const transcript =
                    result[0].transcript;


                processSpeech(
                    transcript
                );
            }
        };


    recognition.onerror =
        event => {

            console.log(
                "Speech error:",
                event.error
            );

        };


    recognition.onend =
        () => {

            recognitionRunning =
                false;


            /*
               Restart recognition only while
               Voice Mode is actually active.
            */

            if (voiceMode) {

                setTimeout(
                    () => {

                        if (!voiceMode)
                            return;

                        try {

                            recognition.start();

                        } catch (e) {}

                    },
                    250
                );
            }
        };


    return true;
}


/* =========================================================
   START VOICE
========================================================= */

function startVoice() {

    /*
       Auto mode MUST die first.
    */

    stopAutoScroll();


    if (!scriptWords.length) {

        if (!buildScript())
            return;
    }


    voiceMode = true;

    autoMode = false;


    voiceModeBtn.classList.add(
        "active"
    );

    autoModeBtn.classList.remove(
        "active"
    );


    status.textContent =
        "🎙 Listening...";

    status.classList.add(
        "listening"
    );


    if (!recognition) {

        if (!setupRecognition()) {

            voiceMode = false;

            return;
        }
    }


    try {

        if (!recognitionRunning) {

            recognition.start();

        }

    } catch (e) {}

}


/* =========================================================
   STOP VOICE
========================================================= */

function stopVoice() {

    voiceMode = false;

    voiceModeBtn.classList.remove(
        "active"
    );

    status.classList.remove(
        "listening"
    );


    if (recognition) {

        try {
            recognition.stop();
        } catch (e) {}

    }


    recognitionRunning =
        false;


    if (!autoMode) {

        status.textContent =
            "Mode: Paused";
    }
}


/* =========================================================
   PROCESS SPEECH
========================================================= */

function processSpeech(transcript) {

    /*
       NEVER process speech outside Voice Mode.
    */

    if (!voiceMode)
        return;


    const spokenWords =
        transcript
            .toLowerCase()
            .replace(/[^\w'\s]/g, "")
            .split(/\s+/)
            .filter(Boolean);


    for (const spoken of spokenWords) {

        if (!voiceMode)
            return;


        if (
            currentWord >=
            scriptWords.length
        ) {

            stopVoice();

            return;
        }


        /*
           Only search a very small window.

           This prevents recognition from jumping
           halfway through the script.
        */

        const searchLimit =
            Math.min(
                currentWord + 4,
                scriptWords.length
            );


        let match =
            -1;


        for (
            let i = currentWord;
            i < searchLimit;
            i++
        ) {

            if (
                scriptWords[i].normalized ===
                spoken
            ) {

                match = i;

                break;
            }
        }


        /*
           NO MATCH = NO MOVEMENT.

           This is the important part.
        */

        if (match === -1)
            continue;


        currentWord =
            match + 1;


        updateActiveWord();
    }


    if (
        currentWord >=
        scriptWords.length
    ) {

        status.textContent =
            "✓ Script finished.";

        stopVoice();
    }
}


/* =========================================================
   VOICE BUTTON
========================================================= */

voiceModeBtn.addEventListener(
    "click",
    () => {

        if (voiceMode) {

            stopVoice();

        } else {

            startVoice();

        }
    }
);


/* =========================================================
   AUTO SCROLL
========================================================= */

function startAutoScroll() {

    stopVoice();


    if (!scriptWords.length) {

        if (!buildScript())
            return;
    }


    autoMode = true;

    voiceMode = false;


    autoModeBtn.classList.add(
        "active"
    );

    voiceModeBtn.classList.remove(
        "active"
    );


    status.textContent =
        "▶ Auto scrolling";


    let lastTime =
        performance.now();


    function animate(now) {

        /*
           AUTO MODE IS THE ONLY THING THAT
           CAN RUN THIS ANIMATION.
        */

        if (!autoMode) {

            autoFrame = null;

            return;
        }


        const delta =
            now - lastTime;


        lastTime = now;


        const speedValue =
            Number(speed.value);


        scriptOffset -=
            speedValue *
            delta /
            50;


        scriptDisplay.style.transform =
            `translate3d(0, ${scriptOffset}px, 0)`;


        autoFrame =
            requestAnimationFrame(
                animate
            );
    }


    autoFrame =
        requestAnimationFrame(
            animate
        );
}


/* =========================================================
   STOP AUTO SCROLL
========================================================= */

function stopAutoScroll() {

    autoMode = false;

    autoModeBtn.classList.remove(
        "active"
    );


    if (autoFrame !== null) {

        cancelAnimationFrame(
            autoFrame
        );

        autoFrame = null;
    }
}


/* =========================================================
   AUTO BUTTON
========================================================= */

autoModeBtn.addEventListener(
    "click",
    () => {

        if (autoMode) {

            stopAutoScroll();

            status.textContent =
                "Mode: Paused";

        } else {

            startAutoScroll();

        }
    }
);


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener(
    "click",
    () => {

        stopEverything();


        if (!scriptWords.length) {

            if (!buildScript())
                return;
        }


        currentWord = 0;

        scriptOffset = 0;


        scriptDisplay.style.transform =
            "translate3d(0,0,0)";


        document
            .querySelectorAll(
                ".script-word.active"
            )
            .forEach(
                el =>
                    el.classList.remove(
                        "active"
                    )
            );


        status.textContent =
            "Mode: Paused";
    }
);


/* =========================================================
   EXIT
========================================================= */

exitBtn.addEventListener(
    "click",
    () => {

        stopEverything();

        prompter.style.display =
            "none";


        if (
            document.fullscreenElement
        ) {

            document.exitFullscreen()
                .catch(() => {});

        }
    }
);


/* =========================================================
   KEYBOARD ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            stopEverything();

            prompter.style.display =
                "none";
        }
    }
);

</script>

</body>
</html>
