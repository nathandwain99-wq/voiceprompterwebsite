<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>VoicePrompter Online</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080b14;
    color: #f4f7ff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

.header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.logo span:first-child {
    color: #4fdcff;
}

.logo span:last-child {
    color: #a970ff;
}

.subtitle {
    margin-top: 6px;
    color: #8993a8;
    font-size: 14px;
}

.setup {
    padding: 18px;
}

textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid #293148;
    background: #111624;
    color: white;
    font-size: 18px;
    line-height: 1.6;
    outline: none;
}

textarea:focus {
    border-color: #4fdcff;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 14px 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.primary {
    background: linear-gradient(135deg, #4fdcff, #8b6cff);
    color: #05070c;
}

.secondary {
    background: #1a2030;
    color: white;
    border: 1px solid #30394f;
}

.speed {
    margin-top: 16px;
    padding: 15px;
    border-radius: 14px;
    background: #111624;
    border: 1px solid #293148;
}

.speed label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: #cbd3e4;
}

input[type="range"] {
    width: 100%;
}

.prompter {
    display: none;
    position: fixed;
    inset: 0;
    background: #05070c;
    z-index: 1000;
    flex-direction: column;
}

.prompter.active {
    display: flex;
}

.prompt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #0b0f19;
    border-bottom: 1px solid #20283a;
}

.prompt-title {
    font-weight: 700;
    color: #b9c4da;
}

.close {
    background: #202738;
    color: white;
    padding: 9px 14px;
}

.script-window {
    flex: 1;
    overflow: hidden;
    position: relative;
}

.script {
    position: absolute;
    width: 100%;
    padding: 45vh 8% 60vh;
    text-align: center;
    font-size: 42px;
    line-height: 1.65;
    font-weight: 700;
    white-space: pre-wrap;
    transform: translateY(0);
}

.center-line {
    position: absolute;
    top: 50%;
    left: 5%;
    right: 5%;
    height: 3px;
    background: #4fdcff;
    opacity: .45;
    box-shadow: 0 0 18px rgba(79,220,255,.5);
    pointer-events: none;
}

.prompt-controls {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #0b0f19;
    border-top: 1px solid #20283a;
}

.prompt-controls button {
    flex: 1;
}

@media (max-width: 600px) {
    .script {
        font-size: 34px;
        padding-left: 6%;
        padding-right: 6%;
    }
}

@media (max-height: 700px) {
    .script {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        <span>Voice</span><span>Prompter</span>
    </div>
    <div class="subtitle">Teleprompter Online</div>
</header>

<main class="setup">

    <textarea id="scriptInput" placeholder="Paste or type your script here..."></textarea>

    <div class="controls">
        <button class="primary" onclick="startPrompter()">Start Prompter</button>
        <button class="secondary" onclick="clearScript()">Clear</button>
    </div>

    <div class="speed">
        <label>
            <span>Scroll Speed</span>
            <strong id="speedValue">2</strong>
        </label>

        <input
            id="speedSlider"
            type="range"
            min="1"
            max="10"
            value="2"
            oninput="updateSpeed()"
        >
    </div>

</main>

<section id="prompter" class="prompter">

    <div class="prompt-header">
        <div class="prompt-title">VoicePrompter</div>
        <button class="close" onclick="closePrompter()">Exit</button>
    </div>

    <div class="script-window" id="scriptWindow">
        <div class="script" id="scriptDisplay"></div>
        <div class="center-line"></div>
    </div>

    <div class="prompt-controls">
        <button class="secondary" onclick="toggleScroll()" id="playButton">
            ▶ Start
        </button>

        <button class="secondary" onclick="restartScroll()">
            ↻ Restart
        </button>
    </div>

</section>

<script>
let scrollPosition = 0;
let scrolling = false;
let animationFrame = null;
let speed = 2;

const input = document.getElementById("scriptInput");
const prompter = document.getElementById("prompter");
const display = document.getElementById("scriptDisplay");
const playButton = document.getElementById("playButton");

function startPrompter() {
    const text = input.value.trim();

    if (!text) {
        alert("Please enter a script first.");
        return;
    }

    display.textContent = text;
    scrollPosition = 0;
    display.style.transform = "translateY(0)";
    prompter.classList.add("active");

    scrolling = false;
    playButton.textContent = "▶ Start";

    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }
}

function closePrompter() {
    scrolling = false;

    if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
    }

    prompter.classList.remove("active");

    if (document.exitFullscreen && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }
}

function toggleScroll() {
    scrolling = !scrolling;

    if (scrolling) {
        playButton.textContent = "⏸ Pause";
        animateScroll();
    } else {
        playButton.textContent = "▶ Start";

        if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
        }
    }
}

function animateScroll() {
    if (!scrolling) {
        return;
    }

    scrollPosition += speed * 0.35;
    display.style.transform = `translateY(-${scrollPosition}px)`;

    animationFrame = requestAnimationFrame(animateScroll);
}

function restartScroll() {
    scrollPosition = 0;
    display.style.transform = "translateY(0)";
}

function updateSpeed() {
    speed = Number(document.getElementById("speedSlider").value);
    document.getElementById("speedValue").textContent = speed;
}

function clearScript() {
    input.value = "";
}
</script>

</body>
</html>
