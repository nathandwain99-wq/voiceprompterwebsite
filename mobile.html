<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>VoicePrompter Mobile</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0f;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #editor {
        width: 100%;
        height: calc(100vh - 150px);
        padding: 20px;
        background: #15151c;
        color: white;
        border: none;
        outline: none;
        resize: none;
        font-size: 20px;
        line-height: 1.6;
    }

    #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 150px;
        background: #111116;
        border-top: 1px solid #333;
        padding: 10px;
        z-index: 100;
    }

    .buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: bold;
        background: #292933;
        color: white;
    }

    button:active {
        transform: scale(.96);
    }

    #voiceBtn.active {
        background: #c62828;
    }

    #autoBtn.active {
        background: #1565c0;
    }

    #restartBtn {
        background: #44444f;
    }

    #status {
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
        color: #aaa;
    }

    #speedBox {
        display: none;
        margin-top: 8px;
        text-align: center;
    }

    #speed {
        width: 80%;
    }

    #prompter {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
        z-index: 50;
    }

    #script {
        position: absolute;
        width: 100%;
        padding: 50vh 25px;
        font-size: 34px;
        line-height: 1.6;
        text-align: center;
        will-change: transform;
    }

    .word {
        display: inline;
    }

    .current {
        background: #ffe600;
        color: #000;
        border-radius: 4px;
        padding: 2px 5px;
    }

    #prompterControls {
        position: fixed;
        bottom: 15px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
        z-index: 200;
    }

    #prompterControls button {
        background: rgba(40,40,45,.9);
    }
</style>
</head>

<body>

<textarea id="editor" placeholder="Paste your script here..."></textarea>

<div id="controls">

    <div class="buttons">
        <button id="voiceBtn">🎙 Voice</button>
        <button id="autoBtn">▶ Auto</button>
        <button id="restartBtn">↻ Restart</button>
    </div>

    <div id="speedBox">
        <input id="speed" type="range" min="1" max="10" value="3">
    </div>

    <div id="status">
        Mode: Paused
    </div>
</div>

<div id="prompter">

    <div id="script"></div>

    <div id="prompterControls">
        <button id="pauseBtn">⏸ Pause</button>
        <button id="exitBtn">✕ Exit</button>
    </div>

</div>

<script>

const editor = document.getElementById("editor");
const voiceBtn = document.getElementById("voiceBtn");
const autoBtn = document.getElementById("autoBtn");
const restartBtn = document.getElementById("restartBtn");
const status = document.getElementById("status");

const prompter = document.getElementById("prompter");
const script = document.getElementById("script");

const pauseBtn = document.getElementById("pauseBtn");
const exitBtn = document.getElementById("exitBtn");

const speedBox = document.getElementById("speedBox");
const speedSlider = document.getElementById("speed");

let words = [];
let currentWord = 0;

let recognition = null;
let voiceMode = false;
let autoMode = false;
let autoAnimation = null;

let shouldRestartRecognition = false;


/* =========================================================
   BUILD SCRIPT
========================================================= */

function buildScript() {

    const text = editor.value.trim();

    if (!text) {
        alert("Enter a script first.");
        return false;
    }

    script.innerHTML = "";

    const tokens = text.split(/(\s+)/);

    words = [];
    currentWord = 0;

    tokens.forEach(token => {

        if (/^\s+$/.test(token)) {

            script.appendChild(
                document.createTextNode(token)
            );

        } else {

            const span = document.createElement("span");

            span.className = "word";
            span.textContent = token;

            script.appendChild(span);

            words.push({
                text: normalize(token),
                element: span
            });
        }
    });

    return true;
}


/* =========================================================
   NORMALIZE WORDS
========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[^\w']/g, "")
        .trim();

}


/* =========================================================
   POSITION SCRIPT
========================================================= */

function positionCurrentWord() {

    if (!words.length) return;

    const word = words[currentWord];

    if (!word) return;

    document.querySelectorAll(".current")
        .forEach(el => el.classList.remove("current"));

    word.element.classList.add("current");

    const rect = word.element.getBoundingClientRect();

    const screenCenter = window.innerHeight / 2;

    const difference =
        screenCenter -
        (rect.top + rect.height / 2);

    const currentTransform =
        script.dataset.offset || 0;

    const newOffset =
        Number(currentTransform) + difference;

    script.dataset.offset = newOffset;

    script.style.transform =
        `translateY(${newOffset}px)`;
}


/* =========================================================
   VOICE RECOGNITION
========================================================= */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice recognition is not supported by this browser. Try Chrome on Android."
        );

        return false;
    }

    recognition = new SpeechRecognition();

    recognition.continuous = true;

    /*
       IMPORTANT:
       Interim results are DISABLED.

       This prevents the browser from repeatedly
       changing partial guesses while you're speaking.
    */
    recognition.interimResults = false;

    recognition.lang = "en-US";

    recognition.maxAlternatives = 1;


    recognition.onstart = function() {

        if (!voiceMode) return;

        status.textContent =
            "🎙 Listening... Speak the script.";

    };


    recognition.onresult = function(event) {

        /*
           ABSOLUTE RULE:

           If voice mode isn't active,
           speech recognition cannot move the script.
        */

        if (!voiceMode) return;

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const result = event.results[i];

            if (!result.isFinal) continue;

            const spokenText =
                result[0].transcript;

            processSpokenText(spokenText);
        }
    };


    recognition.onerror = function(event) {

        if (!voiceMode) return;

        console.log(
            "Speech recognition:",
            event.error
        );

        status.textContent =
            "🎙 Listening...";

    };


    recognition.onend = function() {

        /*
           Chrome sometimes stops recognition by itself.

           Restart ONLY if Voice Mode is still active.
        */

        if (
            voiceMode &&
            shouldRestartRecognition
        ) {

            setTimeout(() => {

                if (!voiceMode) return;

                try {
                    recognition.start();
                } catch (e) {}

            }, 100);
        }
    };

    return true;
}


/* =========================================================
   PROCESS SPOKEN TEXT
========================================================= */

function processSpokenText(text) {

    if (!voiceMode) return;

    const spokenWords =
        text
            .toLowerCase()
            .replace(/[^\w'\s]/g, "")
            .split(/\s+/)
            .filter(Boolean);

    /*
       Only advance when the spoken words actually
       match upcoming script words.
    */

    for (const spoken of spokenWords) {

        if (!voiceMode) return;

        if (currentWord >= words.length) {
            stopVoice();
            return;
        }

        let found = -1;

        /*
           Search only a SMALL window ahead.

           This prevents one recognition result from
           jumping halfway through the script.
        */

        const maxSearch =
            Math.min(
                currentWord + 5,
                words.length
            );

        for (
            let i = currentWord;
            i < maxSearch;
            i++
        ) {

            if (
                words[i].text === spoken
            ) {

                found = i;
                break;
            }
        }

        if (found !== -1) {

            currentWord = found + 1;

            positionCurrentWord();

        }
    }

    if (currentWord >= words.length) {

        status.textContent =
            "✓ Script finished.";

        stopVoice();
    }
}


/* =========================================================
   START VOICE MODE
========================================================= */

function startVoice() {

    if (!buildScript()) return;

    /*
       KILL AUTO MODE FIRST.
    */

    stopAuto();

    voiceMode = true;
    autoMode = false;

    voiceBtn.classList.add("active");
    autoBtn.classList.remove("active");

    speedBox.style.display = "none";

    prompter.style.display = "block";

    script.dataset.offset = 0;
    script.style.transform =
        "translateY(0px)";

    positionCurrentWord();

    if (!recognition) {

        if (!setupRecognition()) {

            voiceMode = false;
            return;
        }
    }

    shouldRestartRecognition = true;

    try {
        recognition.start();
    } catch (e) {}

    status.textContent =
        "🎙 Listening... Speak the script.";
}


/* =========================================================
   STOP VOICE
========================================================= */

function stopVoice() {

    voiceMode = false;
    shouldRestartRecognition = false;

    voiceBtn.classList.remove("active");

    if (recognition) {

        try {
            recognition.stop();
        } catch (e) {}
    }

    status.textContent =
        "Mode: Paused";
}


/* =========================================================
   AUTO SCROLL
========================================================= */

function startAuto() {

    if (!buildScript()) return;

    /*
       KILL VOICE MODE FIRST.
    */

    stopVoice();

    autoMode = true;
    voiceMode = false;

    autoBtn.classList.add("active");
    voiceBtn.classList.remove("active");

    speedBox.style.display = "block";

    prompter.style.display = "block";

    script.dataset.offset = 0;
    script.style.transform =
        "translateY(0px)";

    let lastTime = performance.now();

    function animate(now) {

        /*
           ABSOLUTE RULE:

           If Auto Mode is no longer active,
           animation stops immediately.
        */

        if (!autoMode) {

            autoAnimation = null;
            return;
        }

        const delta =
            now - lastTime;

        lastTime = now;

        const speed =
            Number(speedSlider.value);

        const movement =
            speed * delta / 50;

        const offset =
            Number(script.dataset.offset || 0);

        const newOffset =
            offset - movement;

        script.dataset.offset =
            newOffset;

        script.style.transform =
            `translateY(${newOffset}px)`;

        autoAnimation =
            requestAnimationFrame(animate);
    }

    autoAnimation =
        requestAnimationFrame(animate);

    status.textContent =
        "▶ Auto scrolling";
}


/* =========================================================
   STOP AUTO
========================================================= */

function stopAuto() {

    autoMode = false;

    autoBtn.classList.remove("active");

    if (autoAnimation !== null) {

        cancelAnimationFrame(
            autoAnimation
        );

        autoAnimation = null;
    }
}


/* =========================================================
   AUTO BUTTON
========================================================= */

autoBtn.addEventListener(
    "click",
    function() {

        if (autoMode) {

            stopAuto();

            status.textContent =
                "Mode: Paused";

        } else {

            startAuto();
        }
    }
);


/* =========================================================
   VOICE BUTTON
========================================================= */

voiceBtn.addEventListener(
    "click",
    function() {

        if (voiceMode) {

            stopVoice();

        } else {

            startVoice();
        }
    }
);


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener(
    "click",
    function() {

        stopVoice();
        stopAuto();

        if (!buildScript()) return;

        currentWord = 0;

        script.dataset.offset = 0;

        script.style.transform =
            "translateY(0px)";

        positionCurrentWord();

        status.textContent =
            "Mode: Paused";
    }
);


/* =========================================================
   PAUSE
========================================================= */

pauseBtn.addEventListener(
    "click",
    function() {

        if (voiceMode) {
            stopVoice();
        }

        if (autoMode) {
            stopAuto();
        }

        status.textContent =
            "Mode: Paused";
    }
);


/* =========================================================
   EXIT
========================================================= */

exitBtn.addEventListener(
    "click",
    function() {

        stopVoice();
        stopAuto();

        prompter.style.display =
            "none";

        status.textContent =
            "Mode: Paused";
    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

status.textContent =
    "Mode: Paused";

</script>

</body>
</html>
