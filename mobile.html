<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b14">

<title>VoicePrompter Online</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080b14;
    color: #f4f7ff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

.header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
    font-size: 26px;
    font-weight: 800;
}

.logo .voice {
    color: #4fdcff;
}

.logo .prompter {
    color: #a970ff;
}

.subtitle {
    margin-top: 6px;
    color: #8993a8;
    font-size: 14px;
}

.setup {
    padding: 18px;
    max-width: 800px;
    margin: auto;
}

textarea {
    width: 100%;
    min-height: 280px;
    resize: vertical;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid #293148;
    background: #111624;
    color: white;
    font-size: 18px;
    line-height: 1.6;
    outline: none;
}

textarea:focus {
    border-color: #4fdcff;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 14px 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.primary {
    background: linear-gradient(135deg, #4fdcff, #8b6cff);
    color: #05070c;
}

.secondary {
    background: #1a2030;
    color: white;
    border: 1px solid #30394f;
}

.voice-button {
    margin-top: 12px;
    width: 100%;
}

.status {
    margin-top: 15px;
    padding: 13px;
    border-radius: 12px;
    background: #111624;
    border: 1px solid #293148;
    color: #aeb8cd;
    text-align: center;
    font-size: 14px;
}

.speed {
    margin-top: 16px;
    padding: 15px;
    border-radius: 14px;
    background: #111624;
    border: 1px solid #293148;
}

.speed label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: #cbd3e4;
}

input[type="range"] {
    width: 100%;
}

/* PROMPTER */

.prompter-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #05070c;
    z-index: 1000;
    flex-direction: column;
}

.prompter-screen.active {
    display: flex;
}

.prompt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #0b0f19;
    border-bottom: 1px solid #20283a;
}

.prompt-title {
    font-weight: 700;
    color: #b9c4da;
}

.close {
    background: #202738;
    color: white;
    padding: 9px 14px;
}

.script-window {
    flex: 1;
    overflow: hidden;
    position: relative;
}

.script {
    position: absolute;
    width: 100%;
    padding: 42vh 7% 60vh;
    text-align: center;
    font-size: 42px;
    line-height: 1.6;
    font-weight: 700;
}

.word {
    display: inline;
}

.word.active {
    color: #ffffff;
    text-shadow:
        0 0 8px #4fdcff,
        0 0 20px #4fdcff;
}

.word.done {
    color: #68748c;
}

.center-line {
    position: absolute;
    top: 50%;
    left: 5%;
    right: 5%;
    height: 3px;
    background: #4fdcff;
    opacity: .45;
    box-shadow: 0 0 18px rgba(79,220,255,.5);
    pointer-events: none;
}

.prompt-controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 10px;
    background: #0b0f19;
    border-top: 1px solid #20283a;
}

.prompt-controls button {
    padding: 12px 8px;
}

.voice-status {
    position: absolute;
    top: 62px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,15,25,.92);
    border: 1px solid #30394f;
    border-radius: 20px;
    padding: 8px 15px;
    color: #b9c4da;
    font-size: 13px;
    z-index: 5;
    white-space: nowrap;
}

.voice-status.listening {
    color: #4fdcff;
    border-color: #4fdcff;
}

@media (max-width: 600px) {
    .script {
        font-size: 34px;
        padding-left: 6%;
        padding-right: 6%;
    }
}

@media (max-height: 700px) {
    .script {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        <span class="voice">Voice</span><span class="prompter">Prompter</span>
    </div>

    <div class="subtitle">
        Voice-Traced Teleprompter
    </div>
</header>

<main class="setup">

    <textarea
        id="scriptInput"
        placeholder="Paste or type your script here..."
    ></textarea>

    <div class="controls">
        <button class="primary" onclick="startPrompter()">
            Start Prompter
        </button>

        <button class="secondary" onclick="clearScript()">
            Clear
        </button>
    </div>

    <button
        class="primary voice-button"
        onclick="testMicrophone()"
    >
        🎙 Test Voice Tracking
    </button>

    <div class="speed">
        <label>
            <span>Scroll Speed</span>
            <strong id="speedValue">2</strong>
        </label>

        <input
            id="speedSlider"
            type="range"
            min="1"
            max="10"
            value="2"
            oninput="updateSpeed()"
        >
    </div>

    <div id="status" class="status">
        Voice tracking is ready.
    </div>

</main>

<section
    id="prompterScreen"
    class="prompter-screen"
>

    <div class="prompt-header">

        <div class="prompt-title">
            VoicePrompter
        </div>

        <button
            class="close"
            onclick="closePrompter()"
        >
            Exit
        </button>

    </div>

    <div
        id="voiceStatus"
        class="voice-status"
    >
        Microphone off
    </div>

    <div
        id="scriptWindow"
        class="script-window"
    >

        <div
            id="scriptDisplay"
            class="script"
        ></div>

        <div class="center-line"></div>

    </div>

    <div class="prompt-controls">

        <button
            class="secondary"
            onclick="startVoiceTracking()"
        >
            🎙 Voice
        </button>

        <button
            class="secondary"
            onclick="toggleScroll()"
            id="playButton"
        >
            ▶ Scroll
        </button>

        <button
            class="secondary"
            onclick="restartScroll()"
        >
            ↻ Restart
        </button>

    </div>

</section>

<script>
let words = [];
let currentWord = 0;

let recognition = null;
let listening = false;

let scrollPosition = 0;
let scrolling = false;
let animationFrame = null;

let speed = 2;


/* -----------------------------
   BROWSER SPEECH RECOGNITION
----------------------------- */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";

    recognition.onstart = function() {

        listening = true;

        updateVoiceStatus(
            "Listening...",
            true
        );
    };

    recognition.onend = function() {

        if (listening) {

            try {
                recognition.start();
            } catch (error) {
                console.log(error);
            }

        } else {

            updateVoiceStatus(
                "Microphone off",
                false
            );
        }
    };

    recognition.onerror = function(event) {

        console.log(
            "Speech recognition error:",
            event.error
        );

        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            listening = false;

            updateVoiceStatus(
                "Microphone permission denied",
                false
            );

        } else if (event.error === "no-speech") {

            updateVoiceStatus(
                "Listening...",
                true
            );
        }
    };

    recognition.onresult = function(event) {

        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            transcript +=
                event.results[i][0].transcript + " ";
        }

        processSpeech(transcript);
    };

} else {

    document.getElementById("status").textContent =
        "Voice tracking is not supported by this browser. Try Chrome on Android or Safari on iPhone.";
}


/* -----------------------------
   START PROMPTER
----------------------------- */

function startPrompter() {

    const text =
        document.getElementById("scriptInput")
        .value
        .trim();

    if (!text) {

        alert(
            "Please enter a script first."
        );

        return;
    }

    createScript(text);

    document
        .getElementById("prompterScreen")
        .classList.add("active");

    currentWord = 0;
    scrollPosition = 0;

    updateScriptPosition();

    if (
        document.documentElement.requestFullscreen
    ) {

        document.documentElement
            .requestFullscreen()
            .catch(() => {});
    }

    updateVoiceStatus(
        "Microphone off",
        false
    );
}


/* -----------------------------
   CREATE WORD-BY-WORD SCRIPT
----------------------------- */

function createScript(text) {

    const display =
        document.getElementById("scriptDisplay");

    display.innerHTML = "";

    const parts =
        text.split(/(\s+)/);

    words = [];

    parts.forEach(part => {

        if (part.trim() === "") {

            display.appendChild(
                document.createTextNode(part)
            );

            return;
        }

        const span =
            document.createElement("span");

        span.className = "word";
        span.textContent = part;

        display.appendChild(span);

        words.push(span);
    });
}


/* -----------------------------
   VOICE TRACKING
----------------------------- */

function startVoiceTracking() {

    if (!recognition) {

        alert(
            "Voice recognition is not supported by this browser."
        );

        return;
    }

    if (listening) {

        stopVoiceTracking();

        return;
    }

    try {

        listening = true;

        recognition.start();

        updateVoiceStatus(
            "Starting microphone...",
            true
        );

    } catch (error) {

        console.log(error);
    }
}


function stopVoiceTracking() {

    listening = false;

    if (recognition) {

        try {
            recognition.stop();
        } catch (error) {
            console.log(error);
        }
    }

    updateVoiceStatus(
        "Microphone off",
        false
    );
}


/* -----------------------------
   MATCH SPOKEN WORDS
----------------------------- */

function processSpeech(transcript) {

    if (!listening || words.length === 0) {
        return;
    }

    const spoken =
        normalizeText(transcript)
        .split(/\s+/)
        .filter(Boolean);

    if (spoken.length === 0) {
        return;
    }

    let searchIndex = currentWord;

    for (
        let i = 0;
        i < spoken.length;
        i++
    ) {

        const spokenWord =
            spoken[i];

        let found = -1;

        const searchLimit =
            Math.min(
                searchIndex + 12,
                words.length
            );

        for (
            let j = searchIndex;
            j < searchLimit;
            j++
        ) {

            const scriptWord =
                normalizeText(
                    words[j].textContent
                );

            if (
                scriptWord === spokenWord ||
                wordsAreSimilar(
                    scriptWord,
                    spokenWord
                )
            ) {

                found = j;
                break;
            }
        }

        if (found !== -1) {

            currentWord = found + 1;
            searchIndex = currentWord;

            updateScriptPosition();
        }
    }

    if (currentWord >= words.length) {

        stopVoiceTracking();

        updateVoiceStatus(
            "Script complete",
            false
        );
    }
}


/* -----------------------------
   WORD COMPARISON
----------------------------- */

function normalizeText(text) {

    return text
        .toLowerCase()
        .replace(/[.,!?;:"'()[\]{}]/g, "")
        .replace(/[^a-z0-9']/g, "")
        .trim();
}


function wordsAreSimilar(a, b) {

    if (!a || !b) {
        return false;
    }

    if (a === b) {
        return true;
    }

    if (
        a.length > 4 &&
        b.length > 4
    ) {

        if (
            a.startsWith(b) ||
            b.startsWith(a)
        ) {

            return true;
        }
    }

    return false;
}


/* -----------------------------
   MOVE SCRIPT TO CURRENT WORD
----------------------------- */

function updateScriptPosition() {

    if (words.length === 0) {
        return;
    }

    words.forEach(
        (word, index) => {

            word.classList.remove("active");
            word.classList.remove("done");

            if (
                index < currentWord - 1
            ) {

                word.classList.add("done");

            } else if (
                index === currentWord - 1
            ) {

                word.classList.add("active");
            }
        }
    );

    const activeWord =
        words[
            Math.min(
                Math.max(currentWord - 1, 0),
                words.length - 1
            )
        ];

    if (!activeWord) {
        return;
    }

    const windowElement =
        document.getElementById(
            "scriptWindow"
        );

    const windowCenter =
        windowElement.clientHeight / 2;

    const wordTop =
        activeWord.offsetTop;

    const target =
        wordTop - windowCenter;

    scrollPosition =
        Math.max(0, target);

    document.getElementById(
        "scriptDisplay"
    ).style.transform =
        `translateY(-${scrollPosition}px)`;
}


/* -----------------------------
   TEST MICROPHONE
----------------------------- */

function testMicrophone() {

    if (!recognition) {

        alert(
            "This browser does not support voice recognition. Try Chrome on Android or Safari on iPhone."
        );

        return;
    }

    alert(
        "The browser will ask for microphone permission. Allow it, then speak normally."
    );

    try {

        listening = true;
        recognition.start();

    } catch (error) {

        console.log(error);
    }
}


/* -----------------------------
   VOICE STATUS
----------------------------- */

function updateVoiceStatus(
    message,
    active
) {

    const status =
        document.getElementById(
            "voiceStatus"
        );

    status.textContent = message;

    if (active) {

        status.classList.add(
            "listening"
        );

    } else {

        status.classList.remove(
            "listening"
        );
    }

    document.getElementById(
        "status"
    ).textContent = message;
}


/* -----------------------------
   MANUAL SCROLL
----------------------------- */

function toggleScroll() {

    scrolling = !scrolling;

    const button =
        document.getElementById(
            "playButton"
        );

    if (scrolling) {

        button.textContent =
            "⏸ Pause";

        animateScroll();

    } else {

        button.textContent =
            "▶ Scroll";

        if (animationFrame) {

            cancelAnimationFrame(
                animationFrame
            );

            animationFrame = null;
        }
    }
}


function animateScroll() {

    if (!scrolling) {
        return;
    }

    scrollPosition +=
        speed * 0.35;

    document.getElementById(
        "scriptDisplay"
    ).style.transform =
        `translateY(-${scrollPosition}px)`;

    animationFrame =
        requestAnimationFrame(
            animateScroll
        );
}


/* -----------------------------
   RESTART
----------------------------- */

function restartScroll() {

    stopVoiceTracking();

    currentWord = 0;
    scrollPosition = 0;

    scrolling = false;

    document.getElementById(
        "playButton"
    ).textContent = "▶ Scroll";

    updateScriptPosition();
}


/* -----------------------------
   SPEED
----------------------------- */

function updateSpeed() {

    speed =
        Number(
            document.getElementById(
                "speedSlider"
            ).value
        );

    document.getElementById(
        "speedValue"
    ).textContent = speed;
}


/* -----------------------------
   CLOSE
----------------------------- */

function closePrompter() {

    stopVoiceTracking();

    scrolling = false;

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }

    document
        .getElementById("prompterScreen")
        .classList.remove("active");

    if (
        document.exitFullscreen &&
        document.fullscreenElement
    ) {

        document.exitFullscreen()
            .catch(() => {});
    }
}


/* -----------------------------
   CLEAR
----------------------------- */

function clearScript() {

    document.getElementById(
        "scriptInput"
    ).value = "";
}
</script>

</body>
</html>
