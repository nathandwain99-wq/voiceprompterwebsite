<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b14">

<title>VoicePrompter Online</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080b14;
    color: #f4f7ff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

.header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
    font-size: 26px;
    font-weight: 800;
}

.voice {
    color: #4fdcff;
}

.prompter {
    color: #a970ff;
}

.subtitle {
    margin-top: 6px;
    color: #8993a8;
    font-size: 14px;
}

.setup {
    padding: 18px;
    max-width: 800px;
    margin: auto;
}

textarea {
    width: 100%;
    min-height: 280px;
    resize: vertical;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid #293148;
    background: #111624;
    color: white;
    font-size: 18px;
    line-height: 1.6;
    outline: none;
}

textarea:focus {
    border-color: #4fdcff;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 14px 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.primary {
    background: linear-gradient(135deg, #4fdcff, #8b6cff);
    color: #05070c;
}

.secondary {
    background: #1a2030;
    color: white;
    border: 1px solid #30394f;
}

.status {
    margin-top: 15px;
    padding: 13px;
    border-radius: 12px;
    background: #111624;
    border: 1px solid #293148;
    color: #aeb8cd;
    text-align: center;
    font-size: 14px;
}

/* PROMPTER */

.prompter-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #05070c;
    z-index: 1000;
    flex-direction: column;
}

.prompter-screen.active {
    display: flex;
}

.prompt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #0b0f19;
    border-bottom: 1px solid #20283a;
    flex-shrink: 0;
}

.prompt-title {
    font-weight: 700;
    color: #b9c4da;
}

.close {
    background: #202738;
    color: white;
    padding: 9px 14px;
}

.script-window {
    flex: 1;
    overflow: hidden;
    position: relative;
}

.script {
    position: absolute;
    width: 100%;
    padding: 42vh 7% 60vh;
    text-align: center;
    font-size: 42px;
    line-height: 1.6;
    font-weight: 700;
    will-change: transform;
}

.word {
    display: inline;
}

.word.done {
    color: #68748c;
}

.word.active {
    color: #ffffff;
    text-shadow:
        0 0 8px #4fdcff,
        0 0 20px #4fdcff;
}

.center-line {
    position: absolute;
    top: 50%;
    left: 5%;
    right: 5%;
    height: 3px;
    background: #4fdcff;
    opacity: .45;
    box-shadow: 0 0 18px rgba(79,220,255,.5);
    pointer-events: none;
}

.voice-status {
    position: absolute;
    top: 62px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,15,25,.94);
    border: 1px solid #30394f;
    border-radius: 20px;
    padding: 8px 15px;
    color: #b9c4da;
    font-size: 13px;
    z-index: 5;
    white-space: nowrap;
}

.voice-status.listening {
    color: #4fdcff;
    border-color: #4fdcff;
    box-shadow: 0 0 15px rgba(79,220,255,.2);
}

.prompt-controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 10px;
    background: #0b0f19;
    border-top: 1px solid #20283a;
    flex-shrink: 0;
}

.prompt-controls button {
    padding: 12px 8px;
}

@media (max-width: 600px) {

    .script {
        font-size: 34px;
        padding-left: 6%;
        padding-right: 6%;
    }
}

@media (max-height: 700px) {

    .script {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        <span class="voice">Voice</span><span class="prompter">Prompter</span>
    </div>

    <div class="subtitle">
        Voice-Traced Teleprompter
    </div>

</header>

<main class="setup">

    <textarea
        id="scriptInput"
        placeholder="Paste or type your script here..."
    ></textarea>

    <div class="controls">

        <button
            class="primary"
            onclick="startPrompter()"
        >
            Start Prompter
        </button>

        <button
            class="secondary"
            onclick="clearScript()"
        >
            Clear
        </button>

    </div>

    <div
        id="status"
        class="status"
    >
        Ready.
    </div>

</main>


<section
    id="prompterScreen"
    class="prompter-screen"
>

    <div class="prompt-header">

        <div class="prompt-title">
            VoicePrompter
        </div>

        <button
            class="close"
            onclick="closePrompter()"
        >
            Exit
        </button>

    </div>


    <div
        id="voiceStatus"
        class="voice-status"
    >
        Mode: Paused
    </div>


    <div
        id="scriptWindow"
        class="script-window"
    >

        <div
            id="scriptDisplay"
            class="script"
        ></div>

        <div class="center-line"></div>

    </div>


    <div class="prompt-controls">

        <button
            class="secondary"
            onclick="toggleVoice()"
            id="voiceButton"
        >
            🎙 Voice
        </button>

        <button
            class="secondary"
            onclick="toggleAutoScroll()"
            id="scrollButton"
        >
            ▶ Auto
        </button>

        <button
            class="secondary"
            onclick="restartPrompter()"
        >
            ↻ Restart
        </button>

    </div>

</section>


<script>

/* =========================================
   STATE
========================================= */

let words = [];

let currentWord = 0;

let voiceMode = false;

let autoScrollMode = false;

let recognition = null;

let recognitionRunning = false;

let restartRecognition = false;

let autoScrollPosition = 0;

let animationFrame = null;

let speed = 2;


/* =========================================
   SPEECH RECOGNITION
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = true;

    recognition.interimResults = true;

    recognition.lang = "en-US";


    recognition.onstart = function() {

        recognitionRunning = true;

        updateVoiceStatus(
            "🎙 Listening...",
            true
        );
    };


    recognition.onend = function() {

        recognitionRunning = false;

        if (
            voiceMode &&
            restartRecognition
        ) {

            setTimeout(
                startRecognition,
                250
            );

        } else {

            updateVoiceStatus(
                "Mode: Paused",
                false
            );
        }
    };


    recognition.onerror = function(event) {

        console.log(
            "Speech recognition:",
            event.error
        );


        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            voiceMode = false;

            restartRecognition = false;

            updateVoiceStatus(
                "Microphone permission denied",
                false
            );

            return;
        }


        if (
            event.error === "network"
        ) {

            updateVoiceStatus(
                "Speech service unavailable",
                false
            );

            return;
        }


        if (
            event.error === "no-speech"
        ) {

            updateVoiceStatus(
                "🎙 Listening...",
                true
            );
        }
    };


    recognition.onresult = function(event) {

        processSpeechResults(event);
    };

}


/* =========================================
   START PROMPTER
========================================= */

function startPrompter() {

    const text =
        document
            .getElementById("scriptInput")
            .value
            .trim();


    if (!text) {

        alert(
            "Please enter a script first."
        );

        return;
    }


    stopEverything();

    createScript(text);

    currentWord = 0;

    autoScrollPosition = 0;


    document
        .getElementById("prompterScreen")
        .classList.add("active");


    updateScriptPosition();


    if (
        document.documentElement.requestFullscreen
    ) {

        document.documentElement
            .requestFullscreen()
            .catch(() => {});
    }


    updateVoiceStatus(
        "Mode: Paused",
        false
    );
}


/* =========================================
   CREATE SCRIPT
========================================= */

function createScript(text) {

    const display =
        document.getElementById(
            "scriptDisplay"
        );


    display.innerHTML = "";

    words = [];


    const parts =
        text.split(/(\s+)/);


    parts.forEach(part => {

        if (
            part.trim() === ""
        ) {

            display.appendChild(
                document.createTextNode(part)
            );

            return;
        }


        const span =
            document.createElement("span");


        span.className = "word";

        span.textContent = part;


        display.appendChild(span);

        words.push(span);
    });
}


/* =========================================
   VOICE MODE
========================================= */

function toggleVoice() {

    if (!recognition) {

        alert(
            "Voice tracking is not supported by this browser."
        );

        return;
    }


    if (voiceMode) {

        stopVoice();

    } else {

        startVoice();
    }
}


function startVoice() {

    if (!recognition) {
        return;
    }


    /* Voice mode ALWAYS disables auto-scroll */

    stopAutoScroll();


    voiceMode = true;

    restartRecognition = true;


    updateVoiceStatus(
        "🎙 Starting microphone...",
        true
    );


    startRecognition();
}


function startRecognition() {

    if (
        !voiceMode ||
        recognitionRunning
    ) {
        return;
    }


    try {

        recognition.start();

    } catch (error) {

        console.log(error);
    }
}


function stopVoice() {

    voiceMode = false;

    restartRecognition = false;


    if (recognition) {

        try {

            recognition.stop();

        } catch (error) {

            console.log(error);
        }
    }


    updateVoiceStatus(
        "Mode: Paused",
        false
    );
}


/* =========================================
   PROCESS SPEECH
========================================= */

function processSpeechResults(event) {

    if (
        !voiceMode ||
        words.length === 0
    ) {
        return;
    }


    let transcript = "";


    /*
       Only process the newest speech result.
       This prevents old recognition results
       from repeatedly advancing the script.
    */

    for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
    ) {

        transcript +=
            event.results[i][0].transcript +
            " ";
    }


    transcript =
        normalizeTranscript(transcript);


    if (!transcript) {
        return;
    }


    const spokenWords =
        transcript
            .split(/\s+/)
            .filter(Boolean);


    /*
       Match each newly recognized word
       against the next section of the script.
    */

    for (
        let i = 0;
        i < spokenWords.length;
        i++
    ) {

        const spokenWord =
            spokenWords[i];


        const found =
            findMatchingScriptWord(
                spokenWord
            );


        if (found !== -1) {

            currentWord =
                found + 1;


            updateScriptPosition();
        }
    }


    if (
        currentWord >= words.length
    ) {

        stopVoice();


        updateVoiceStatus(
            "✓ Script complete",
            false
        );
    }
}


/* =========================================
   FIND MATCH
========================================= */

function findMatchingScriptWord(
    spokenWord
) {

    /*
       Look ahead up to 10 words.
       This allows recognition to skip
       small differences or missed words.
    */

    const maxSearch =
        Math.min(
            currentWord + 10,
            words.length
        );


    for (
        let i = currentWord;
        i < maxSearch;
        i++
    ) {

        const scriptWord =
            normalizeWord(
                words[i].textContent
            );


        if (
            scriptWord === spokenWord
        ) {

            return i;
        }


        /*
           Allow simple speech-recognition
           variations such as plural endings.
        */

        if (
            wordsAreSimilar(
                scriptWord,
                spokenWord
            )
        ) {

            return i;
        }
    }


    return -1;
}


/* =========================================
   NORMALIZATION
========================================= */

function normalizeTranscript(text) {

    return text
        .toLowerCase()
        .replace(
            /[.,!?;:"'()[\]{}]/g,
            ""
        )
        .replace(
            /[^a-z0-9\s]/g,
            ""
        )
        .trim();
}


function normalizeWord(text) {

    return text
        .toLowerCase()
        .replace(
            /[.,!?;:"'()[\]{}]/g,
            ""
        )
        .replace(
            /[^a-z0-9]/g,
            ""
        )
        .trim();
}


function wordsAreSimilar(
    a,
    b
) {

    if (
        !a ||
        !b
    ) {
        return false;
    }


    if (
        a === b
    ) {
        return true;
    }


    /*
       Ignore simple plural differences.
    */

    if (
        a.length > 4 &&
        b.length > 4
    ) {

        if (
            a + "s" === b ||
            b + "s" === a
        ) {

            return true;
        }


        if (
            a.startsWith(b) ||
            b.startsWith(a)
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================
   POSITION SCRIPT
========================================= */

function updateScriptPosition() {

    if (
        words.length === 0
    ) {
        return;
    }


    words.forEach(
        (word, index) => {

            word.classList.remove(
                "active"
            );

            word.classList.remove(
                "done"
            );


            if (
                index < currentWord - 1
            ) {

                word.classList.add(
                    "done"
                );

            } else if (
                index === currentWord - 1
            ) {

                word.classList.add(
                    "active"
                );
            }
        }
    );


    const activeIndex =
        Math.min(
            Math.max(
                currentWord - 1,
                0
            ),
            words.length - 1
        );


    const activeWord =
        words[activeIndex];


    if (!activeWord) {
        return;
    }


    const scriptWindow =
        document.getElementById(
            "scriptWindow"
        );


    const center =
        scriptWindow.clientHeight / 2;


    const target =
        activeWord.offsetTop -
        center;


    const position =
        Math.max(
            0,
            target
        );


    document
        .getElementById(
            "scriptDisplay"
        )
        .style.transform =
        `translateY(-${position}px)`;
}


/* =========================================
   AUTO SCROLL
========================================= */

function toggleAutoScroll() {

    if (autoScrollMode) {

        stopAutoScroll();

        return;
    }


    /*
       Auto-scroll ALWAYS disables voice mode.
    */

    stopVoice();


    autoScrollMode = true;


    document.getElementById(
        "scrollButton"
    ).textContent =
        "⏸ Auto";


    updateVoiceStatus(
        "▶ Auto-scrolling",
        false
    );


    animateAutoScroll();
}


function animateAutoScroll() {

    if (!autoScrollMode) {
        return;
    }


    autoScrollPosition +=
        speed * 0.35;


    document
        .getElementById(
            "scriptDisplay"
        )
        .style.transform =
        `translateY(-${autoScrollPosition}px)`;


    animationFrame =
        requestAnimationFrame(
            animateAutoScroll
        );
}


function stopAutoScroll() {

    autoScrollMode = false;


    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    document.getElementById(
        "scrollButton"
    ).textContent =
        "▶ Auto";
}


/* =========================================
   STOP EVERYTHING
========================================= */

function stopEverything() {

    voiceMode = false;

    restartRecognition = false;

    stopAutoScroll();


    if (recognition) {

        try {

            recognition.stop();

        } catch (error) {

            console.log(error);
        }
    }
}


/* =========================================
   RESTART
========================================= */

function restartPrompter() {

    stopEverything();


    currentWord = 0;

    autoScrollPosition = 0;


    updateScriptPosition();


    updateVoiceStatus(
        "Mode: Paused",
        false
    );
}


/* =========================================
   STATUS
========================================= */

function updateVoiceStatus(
    message,
    listening
) {

    const element =
        document.getElementById(
            "voiceStatus"
        );


    element.textContent =
        message;


    if (listening) {

        element.classList.add(
            "listening"
        );

    } else {

        element.classList.remove(
            "listening"
        );
    }


    document.getElementById(
        "status"
    ).textContent =
        message;
}


/* =========================================
   CLOSE
========================================= */

function closePrompter() {

    stopEverything();


    document
        .getElementById(
            "prompterScreen"
        )
        .classList.remove("active");


    if (
        document.exitFullscreen &&
        document.fullscreenElement
    ) {

        document
            .exitFullscreen()
            .catch(() => {});
    }
}


/* =========================================
   CLEAR
========================================= */

function clearScript() {

    document.getElementById(
        "scriptInput"
    ).value = "";
}

</script>

</body>
</html>
